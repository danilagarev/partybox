name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partybox
          POSTGRES_PASSWORD: partybox_test
          POSTGRES_DB: partybox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U partybox -d partybox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://partybox:partybox_test@127.0.0.1:5432/partybox_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: |
          for script in deploy/production/*.sh deploy/ingress/switch-to-caddy.sh; do
            bash -n "$script"
          done
      - run: node --test deploy/production/test-release.mjs deploy/production/test-resolve-checks.mjs
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s deploy/ingress -p 'test_*.py'
      - name: Measure Spy rule and projection workload
        run: node scripts/benchmark-spy.mjs --output output/benchmarks/spy.json
      - name: Publish the Spy benchmark measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: partybox-spy-benchmark-${{ github.sha }}-${{ github.run_attempt }}
          path: output/benchmarks/spy.json
          if-no-files-found: error
          retention-days: 30

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
        working-directory: packages/game_core
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: make check-mobile
      - name: Build shared production web client
        run: FLUTTER_BIN=flutter bash scripts/build-web.sh
      - name: Pass the web bundle to HTTPS tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: partybox-web-ci-${{ github.sha }}
          path: deploy/web/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  https:
    needs: [node, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: npm ci
      - run: dart pub get --enforce-lockfile
        working-directory: packages/game_core
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: partybox-web-ci-${{ github.sha }}
          path: deploy/web/
      - run: node scripts/verify-web.mjs deploy/web
      - run: node deploy/smoke.mjs
        env:
          FLUTTER_BIN: flutter
      - run: node deploy/production/test-smoke.mjs
        env:
          REQUIRE_WEB_BUNDLE: true
      - name: Preserve the tested web bundle for this Checks attempt
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: partybox-release-web-${{ github.sha }}-${{ github.run_attempt }}
          path: deploy/web/
          if-no-files-found: error
          retention-days: 30
