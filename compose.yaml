services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: partybox
      POSTGRES_PASSWORD: partybox_dev
      POSTGRES_DB: partybox
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - partybox_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U partybox -d partybox']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  partybox_postgres:
